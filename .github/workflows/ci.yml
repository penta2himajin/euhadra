name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Default-features build, integration + unit + doc tests, and clippy.
  test:
    name: test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Deliberately no libasound2-dev here. The default feature set must
      # build with no system libraries at all — that is the whole point of
      # gating cpal behind `mic` — and the only way to keep that true is to
      # run this job on a machine that does not have ALSA installed.

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Doc tests
        run: cargo test --doc --locked

  # The `cli` feature, which is what carries the binary. Without this job
  # `--all-targets` above silently skips src/main.rs, because a target
  # whose required-features are unmet is not an error — it is simply not
  # built. The binary would rot unnoticed.
  cli:
    name: test (cli feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Build
        run: cargo build --all-targets --features cli --locked

      - name: Clippy
        run: cargo clippy --all-targets --features cli --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --features cli --locked

  # The `vad` feature, which carries `EarshotVad`. The default job above
  # builds the `vad` module's trait, segmenter and `EnergyVad`, but not
  # the neural backend — and an unbuilt backend rots, which is the same
  # reasoning that gave `cli` its own job. Tests run here rather than
  # check-only: `earshot` embeds its network, so there is no artifact to
  # fetch and nothing to keep out of CI.
  vad:
    name: test (vad feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: vad

      # No system dependencies on purpose. `vad` must stay installable
      # without ALSA or an ONNX runtime; running it on a bare machine is
      # what keeps that true.

      - name: Build
        run: cargo build --all-targets --features vad --locked

      - name: Clippy
        run: cargo clippy --all-targets --features vad --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --features vad --locked

      - name: Doc tests
        run: cargo test --doc --features vad --locked

  # Verify the optional `onnx` feature still type-checks and lints clean.
  # We don't run the ONNX test path because the bundled models aren't
  # available in CI; `check + clippy` catches regressions in the surface
  # without requiring model artifacts.
  onnx-check:
    name: check (onnx feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: onnx

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Check (onnx)
        run: cargo check --features onnx --all-targets --locked

      - name: Clippy (onnx)
        run: cargo clippy --features onnx --all-targets --locked -- -D warnings

      # `examples/eval_vad.rs` needs both features, so neither the `vad`
      # job nor the two steps above build it — a target whose
      # required-features are unmet is skipped silently. The two steps
      # above stay `onnx`-only because enabling `onnx` alone has to keep
      # compiling; this one covers the combination.
      - name: Check (onnx + vad)
        run: cargo check --features onnx,vad --all-targets --locked

  # L1 ASR live smoke (§1.1 / §3.8): runs Canary-180M-Flash (en + es),
  # Parakeet (ja), Paraformer-large (zh), Whisper-large-v3-turbo ONNX
  # (ko), and whisper-tiny (fallback) on a 10-utterance FLEURS subset
  # per language, measures WER/CER + ASR/E2E latency + RTF, and gates
  # against docs/benchmarks/ci_baseline.json. All large artefacts
  # (whisper.cpp build, GGML models, FLEURS subset, parakeet-ja
  # ONNX bundle, paraformer-zh ONNX bundle, canary en + es ONNX
  # bundles, whisper-onnx-turbo ONNX bundle) are cached so warm
  # runs finish in a couple of minutes.
  # Parakeet-ja replaced whisper-tiny for `ja` in PR #11 (CER 42% → 3.3%).
  # Parakeet-v3 replaced whisper-tiny.en for `en` in PR #12 (WER 8.4% → 7.5%),
  # then Canary-180M-Flash INT8 replaced Parakeet-v3 for `en` in
  # PR #61 / issue #57 (WER 7.5% → 4.4%, ~2.4 GB → ~213 MB).
  # Paraformer-large replaced whisper-tiny for `zh` in PR #14
  # (CER 37% → ~5%; baseline numbers recalibrated in a follow-up commit).
  # SenseVoice-Small added `ko` in PR #45, then Whisper-large-v3-turbo
  # ONNX (q4) replaced SenseVoice for `ko` in PR #106 / issue #83
  # (CER 6.64% → 0.95%, no Python deps, same `onnx` feature gate).
  evaluate-asr:
    name: evaluate (ASR live smoke)
    runs-on: ubuntu-latest
    # Warm-cache runs finish in ~4 min. The cold Whisper-ONNX-Turbo
    # download is curl-only (~900 MB), much faster than the legacy
    # SenseVoice self-export. 45 min still gives enough headroom for
    # a fully cold run (whisper.cpp + GGML + ONNX bundles); subsequent runs hit cache and exit
    # well under the original 30 min budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # CI runner CPU identification — surfaces whether INT8 acceleration
      # primitives (AVX-VNNI / AVX-512 VNNI / AMX) are available on this
      # runner. ONNX Runtime's INT8 MatMul kernels fall back to a
      # dequantize-then-FP32 path on CPUs that lack VNNI, which can make
      # INT8 weights slower than FP32 even though the bundle is smaller.
      # We dump both the model name and the INT8-relevant flag subset so
      # the Canary INT8 latency numbers can be interpreted against the
      # hardware they were measured on (issue #58 PR #64 follow-up).
      - name: Dump CPU info (INT8 acceleration check)
        run: |
          echo "## CPU model"
          grep -m1 '^model name' /proc/cpuinfo || true
          echo
          echo "## INT8-relevant flags (presence => hardware-accelerated INT8)"
          grep -m1 '^flags' /proc/cpuinfo \
            | tr ' ' '\n' \
            | grep -iE '^(avx_vnni|avx512_vnni|avx512bw|avx512vbmi2|amx_int8|amx_bf16|amx_tile|fma|sse4_2)$' \
            | sort -u \
            || echo '(none present)'
          echo
          echo "## Full CPU flags (first CPU)"
          grep -m1 '^flags' /proc/cpuinfo

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: eval

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config build-essential cmake python3-pip

      - name: Install Python deps for FLEURS download
        run: pip3 install --quiet 'datasets==2.21.0' soundfile librosa

      - name: Cache whisper.cpp build + tiny models
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper.cpp
          key: whisper-cpp-v1.7.4-tiny-${{ runner.os }}

      - name: Build whisper.cpp + download tiny models
        run: bash scripts/setup_whisper.sh

      - name: Cache FLEURS subset
        id: fleurs-cache
        uses: actions/cache@v4
        with:
          path: data/fleurs_subset
          key: fleurs-subset-v3-en-ja-zh-es-ko-n30

      # 30 rather than 10. At n=10 a single utterance moves a language's
      # CER by ~10% relative, which is too coarse for the gate to mean
      # much and too coarse to carry a routing decision -- ko measured
      # 3.7x the incumbent's error on the 10-utterance subset against
      # 2.3x on 30 (docs/korean-asr-alternatives.md §I.7).
      #
      # It is affordable now specifically because ko moved off Whisper.
      # Per-language ASR time x10 was en 13.7s / ja 12.5s / zh 4.3s /
      # es 13.5s / ko 16.2s = 60s, where ko alone used to be 148s. At
      # n=30 the whole suite costs ~180s -- still less than the 192s the
      # n=10 suite cost before the switch.
      #
      # The stream is deterministic, so n=30 extends the n=10 set rather
      # than resampling it: the first ten ids are unchanged.
      #
      # Raising it moved every language's accuracy the same way, which is
      # the finding rather than a side effect -- the first ten utterances
      # were systematically easier than the next twenty:
      #
      #   en WER 0.0439 -> 0.0762 (+74%)   ja CER 0.0331 -> 0.0724 (+119%)
      #   ko CER 0.0330 -> 0.0613 (+86%)   es WER 0.0528 -> 0.0621 (+18%)
      #   zh CER 0.0553 -> 0.0607 (+10%)
      #
      # Five out of five in the same direction is not sampling noise. The
      # n=10 gate was reporting numbers roughly 1.5-2x better than the
      # corpus for four of the five languages. RTF barely moved over the
      # same change (en 0.147 -> 0.137, ko 0.144 -> 0.142), so it was the
      # accuracy metric that was subset-dependent, not the timing.
      # Do not lower this back to 10 to make a regression go away.
      - name: Download FLEURS subset (cache miss only)
        if: steps.fleurs-cache.outputs.cache-hit != 'true'
        run: python3 scripts/download_fleurs_subset.py --lang en --lang ja --lang zh --lang es --lang ko --n 30

      - name: Cache parakeet-ja ONNX bundle (~2.4 GB)
        id: parakeet-ja-cache
        uses: actions/cache@v4
        with:
          path: vendor/parakeet_ja
          key: parakeet-tdt-ctc-0.6b-ja-sunilmahendrakar-v1

      - name: Download parakeet-ja model (cache miss only)
        if: steps.parakeet-ja-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_parakeet_ja.sh
        env:
          PARAKEET_JA_DIR: vendor/parakeet_ja

      - name: Cache paraformer-zh ONNX bundle (~240 MB)
        id: paraformer-zh-cache
        uses: actions/cache@v4
        with:
          path: vendor/paraformer_zh
          key: paraformer-large-zh-funasr-quant-v1

      - name: Download paraformer-zh model (cache miss only)
        if: steps.paraformer-zh-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_paraformer_zh.sh
        env:
          PARAFORMER_ZH_DIR: vendor/paraformer_zh

      - name: Cache canary-es ONNX bundle (~213 MB INT8)
        id: canary-es-cache
        uses: actions/cache@v4
        with:
          path: vendor/canary_es
          key: canary-180m-flash-istupakov-es-int8-v1

      - name: Download canary-es model (cache miss only)
        if: steps.canary-es-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_canary.sh
        env:
          CANARY_DIR: vendor/canary_es

      # canary-en uses the SAME `canary-180m-flash` multilingual
      # checkpoint as canary-es — both now run on the INT8 weights
      # (issue #58 flipped es from FP32 → INT8, matching en's Phase 2
      # swap in issue #57). The bundles still live in separate vendor
      # dirs / cache slots because the adapter is configured per
      # language (e.g. language tag, prompt format) and we don't want
      # one language's hypothesis-time mutation to clobber the other's
      # cache entry. The cache keys are kept distinct (`-es-int8-v1`
      # vs `-int8-v1`) so the two slots can be evicted independently.
      - name: Cache canary-en ONNX bundle (~213 MB INT8)
        id: canary-en-cache
        uses: actions/cache@v4
        with:
          path: vendor/canary_en
          key: canary-180m-flash-istupakov-int8-v1

      - name: Download canary-en model (cache miss only)
        if: steps.canary-en-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_canary.sh
        env:
          CANARY_DIR: vendor/canary_en

      # Whisper-large-v3-turbo ONNX bundle for ko (~900 MB total:
      # tokenizer.json + 3 quantised ONNX files at `q4`). Direct
      # download from the `onnx-community/whisper-large-v3-turbo`
      # HuggingFace mirror — no re-export, no Python deps. Replaces
      # the SenseVoice-Small slot we used to ship; the #83 bench
      # measured CER 1.09% vs SenseVoice's 6.64% on FLEURS-ko.
      - name: Cache whisper-onnx-turbo ko bundle (~900 MB, q4)
        id: whisper-onnx-cache
        uses: actions/cache@v4
        with:
          path: vendor/whisper_onnx_turbo
          key: whisper-large-v3-turbo-onnx-q4-v1

      - name: Download whisper-onnx-turbo (cache miss only)
        if: steps.whisper-onnx-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_whisper_onnx_turbo.sh
        env:
          WHISPER_ONNX_DIR: vendor/whisper_onnx_turbo

      # ko routes through Dolphin CTC as of docs/korean-asr-alternatives.md
      # §I. The whisper-onnx bundle above is still fetched: it remains the
      # runtime for anyone who wants the accuracy, and dropping it here
      # would leave that path untested.
      - name: Cache dolphin-ko bundle
        id: dolphin-ko-cache
        uses: actions/cache@v4
        with:
          path: vendor/dolphin_ko
          key: dolphin-small-ctc-int8-2025-04-02-v1

      - name: Download dolphin-ko (cache miss only)
        if: steps.dolphin-ko-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_dolphin_ko.sh
        env:
          DOLPHIN_KO_DIR: vendor/dolphin_ko

      - name: Build eval binary (with onnx for Parakeet/Paraformer/Canary/WhisperOnnx/Dolphin adapters)
        run: cargo build --release --example eval_l1_smoke --features onnx --locked

      - name: Prepare ORT profile output dir
        run: mkdir -p "${{ github.workspace }}/canary-profile"

      - name: Run L1 smoke evaluation
        env:
          # Force INT8 for both `en` and `es` canary slots. `en` already
          # defaults to INT8 in `load_canary_adapter` (issue #57), so this
          # is a no-op for `en` and the actual flip for `es` (issue #58).
          # Setting it at job scope keeps the two slots symmetric and
          # makes the variant explicit in the CI log.
          CANARY_INT8: "1"
          # ORT per-op profile JSONs for both Canary sessions (en + es,
          # encoder + decoder = 4 traces total, named
          # `canary-{encoder,decoder}_<timestamp>.json`). Uploaded as
          # an artifact by the next step. Used to diagnose whether the
          # ORT runtime is picking INT8 GEMM kernels
          # (`MatMulIntegerToFloat` / `QLinearMatMul`) or falling back
          # to dequantize-then-FP32 on runners without AVX-VNNI. See
          # `src/canary/profiling.rs` and issue #58 PR #64 for the
          # investigation context.
          CANARY_PROFILE_DIR: ${{ github.workspace }}/canary-profile
        run: |
          ./target/release/examples/eval_l1_smoke \
            --whisper-cli vendor/whisper.cpp/build/bin/whisper-cli \
            --model-en vendor/whisper.cpp/models/ggml-tiny.en.bin \
            --model-multi vendor/whisper.cpp/models/ggml-tiny.bin \
            --data-dir data/fleurs_subset \
            --canary-en-dir vendor/canary_en \
            --parakeet-ja-dir vendor/parakeet_ja \
            --paraformer-zh-dir vendor/paraformer_zh \
            --canary-es-dir vendor/canary_es \
            --dolphin-ko-dir vendor/dolphin_ko \
            --langs en,ja,zh,es,ko \
            --baseline docs/benchmarks/ci_baseline.json \
            --dump-utterances

      - name: List captured Canary profile traces
        if: always()
        run: ls -la "${{ github.workspace }}/canary-profile" || true

      - name: Upload Canary ORT profile traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-ort-profile-${{ github.run_id }}
          path: ${{ github.workspace }}/canary-profile/*.json
          if-no-files-found: warn
          retention-days: 7

  # L1 fast layer ablation + per-layer μ-benchmark (§1.1 / §3.8 Phase A-2).
  # Replays committed text fixtures through MockAsr → post-ASR layers,
  # measures ΔWER per layer config and per-layer p50/p95 latency.
  # No whisper, no audio, no network — completes in seconds.
  evaluate-fast:
    name: evaluate (layer ablation + μ-benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: eval-fast

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Build eval binary
        run: cargo build --release --example eval_l1_fast --locked

      - name: Run L1 fast evaluation
        run: |
          ./target/release/examples/eval_l1_fast \
            --fixtures-dir tests/evaluation/fixtures \
            --baseline docs/benchmarks/ci_baseline_layers.json

  # Embedding-backend coverage for the Tier 2 consumers.
  #
  # Two assertions, both narrow on purpose:
  #
  #   1. `check_embedder` — the backend loads and produces same-width,
  #      finite, unit-norm vectors in all five pipeline languages, and
  #      ranks a related string above an unrelated one. This catches a
  #      broken CJK tokenizer, a bad quantised export, or an input
  #      signature regression. bge-small-en-v1.5 fails it on `zh`.
  #   2. `eval_l3 --task phoneme-correction` at the alpha = 0.70 that
  #      docs/spec.md §6.4 works its example at, gated on
  #      correction-pair F1. This is the composite phoneme+semantic
  #      path, which shipped unmeasured until --embedder-dir existed.
  #
  # What it deliberately does NOT assert: any multilingual *accuracy*
  # claim. No gold data exists for ParagraphSplitter (none at all) or
  # for PhonemeCorrector outside English, so there is nothing to score.
  # See docs/model-upgrade-candidates.md §5.
  evaluate-embedder:
    name: evaluate (embedding backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: eval-embedder

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      # fp32, not the INT8 variant: quantisation costs a correction at
      # alpha 0.70 (F1 0.973), so INT8 would force the gate below the
      # value the spec documents. Recorded in
      # docs/benchmarks/embedder_calibration/phoneme_alpha_sweep.json.
      - name: Cache granite embedding bundle (~390 MB fp32)
        id: granite-embedder-cache
        uses: actions/cache@v4
        with:
          path: vendor/embedder_granite_97m
          key: granite-embedding-97m-multilingual-r2-fp32-v1

      - name: Download granite embedder (cache miss only)
        if: steps.granite-embedder-cache.outputs.cache-hit != 'true'
        run: bash scripts/setup_embedders.sh
        env:
          EMBEDDER_MODEL: granite
          EMBEDDER_DIR: vendor/embedder_granite_97m

      - name: Build eval binaries (onnx)
        run: |
          cargo build --release --features onnx --locked \
            --example check_embedder --example eval_l3

      - name: Embedding backend smoke (en / ja / zh / ko / es)
        run: |
          ./target/release/examples/check_embedder \
            --model-dir vendor/embedder_granite_97m

      - name: Phoneme correction with composite scoring (alpha 0.70)
        run: |
          ./target/release/examples/eval_l3 \
            --task phoneme-correction --lang en \
            --input tests/evaluation/annotations/en_phoneme_correction.jsonl \
            --dict tests/evaluation/annotations/en_phoneme_correction_dict.json \
            --base-dict tests/evaluation/annotations/en_phoneme_correction_base_dict.json \
            --embedder-dir vendor/embedder_granite_97m \
            --alpha 0.70 \
            --min-f1 1.0

  # Spanish Tier 1, the one language whose gold cannot be committed.
  #
  # CIEMPIESS Test is CC-BY-SA-4.0, so derived annotations would carry
  # ShareAlike into this MIT/Apache tree. The generator therefore runs
  # here against a streamed copy of the transcripts (no audio is
  # fetched), writes to a gitignored cache, and only the score leaves
  # the job. docs/evaluation.md §2.5 has the full posture; docs/spec.md
  # §11.4 explains why that makes this job the only safeguard Spanish
  # has — no committed gold means no regression check without it.
  #
  # Be clear about what the gate is worth. The lexicons in
  # build_es_filler_annotations.py are byte-identical to
  # SpanishFillerFilter's, so F1 1.0 means the Rust filter agrees with
  # the Python generator. It catches drift between the two and
  # regressions in tokenisation or span arithmetic. It is not a quality
  # measurement, because the gold derives from the same rules rather
  # than from human judgement.
  #
  # It also cannot catch the class of bug fixed in #121: CIEMPIESS
  # transcripts carry no punctuation at all (0 of 3558 utterances), so a
  # filter that fails on "eh, ..." scores perfectly here. Covering that
  # needs a punctuated variant of this corpus, which does not exist yet.
  #
  # Coverage is narrower than the lexicon suggests. Of the 15 pure-filler
  # entries, only "e" occurs in this corpus (1365 spans); the other 14 —
  # eh, ehm, mm, hmm, ah, oh and variants — never appear, so drift in any
  # of them is invisible here. What the gate really exercises is "e",
  # "o sea" (199), the repetition detector (rep 1218 / rep2 263) and
  # partial words (66), over 3558 real utterances.
  #
  # Verified by deletion: removing "e" from SpanishFillerFilter drops
  # span F1 to 0.719 and the job fails. Removing "eh" changes nothing.
  evaluate-es-filler:
    name: evaluate (es filler F1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: eval-es-filler

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install huggingface_hub
        run: pip install --no-cache-dir huggingface_hub

      - name: Generator self-test
        run: python3 scripts/build_es_filler_annotations.py --self-test

      # Fetches corpus/files/metadata_{split}.tsv (585 KB) and nothing
      # else. The audio lives in a separate tarball that is never touched,
      # and nothing derived from the corpus is committed.
      - name: Build annotations from CIEMPIESS Test (download-only)
        run: |
          mkdir -p data/cache
          python3 scripts/build_es_filler_annotations.py \
            --out data/cache/es_filler_annotations.jsonl

      - name: Build eval binary
        run: |
          cargo build --release --features testing --locked --example eval_l3

      # 1.0 because generator and filter share their lexicons: anything
      # below it means the two have diverged, which is exactly the
      # regression this job exists to catch.
      - name: Spanish filler direct F1
        run: |
          ./target/release/examples/eval_l3 \
            --task filler --lang es \
            --input data/cache/es_filler_annotations.jsonl \
            --min-f1 1.0
