[package]
name = "euhadra"
version = "0.2.0"
edition = "2021"
description = "A programmable voice input framework — ASR, LLM refinement, and OS integration as composable adapters"
license = "MIT OR Apache-2.0"
repository = "https://github.com/penta2himajin/euhadra"
documentation = "https://docs.rs/euhadra"
readme = "README.md"
keywords = ["speech-recognition", "asr", "dictation", "voice", "pipeline"]
categories = ["multimedia::audio", "text-processing", "api-bindings"]
# Verified by building the library on this toolchain, not inferred. It
# covers the default feature set only; the optional features raise the
# floor through their own dependencies (`cli` needs 1.85 for clap, `vad`
# needs 1.87 for earshot, `onnx` needs 1.88 for ort), and those crates
# report that themselves.
rust-version = "1.78"
# The evaluation corpora, model-fetch scripts and design docs are how the
# crate is developed, not how it is consumed; none of them are reachable
# from the library. Keeping them out holds the published tarball to the
# code a dependent actually compiles.
exclude = [
    "/.github/",
    "/docs/",
    "/scripts/",
    "/models/",
    "/patches/",
    "/git-hooks/",
    # Annotated evaluation corpora, replayed only by the eval runners.
    # `/tests/fixtures/` is NOT excluded: fbank.rs pulls the Dolphin
    # golden vectors in with include_str!, so dropping it would break
    # `cargo test --features onnx` on the published crate.
    "/tests/evaluation/",
    "CLAUDE.md",
]

# docs.rs builds with default features, which would hide every ONNX
# adapter and both OS-integration modules. Build the full surface there
# instead, and turn on the `docsrs` cfg so feature requirements are
# labelled on each gated item.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Typed errors. Proc-macro only — no runtime cost, and it keeps the
# per-layer error enums readable instead of hand-rolling Display and
# From for each one.
thiserror = "2"
# Inverse text normalization (spoken-form numerals → written form) for
# the non-LLM TextProcessor tier. Pure Rust, no native deps, so it
# stays in the default build.
text-processing-rs = "0.2.2"

# CLI and OS-integration dependencies (opt-in).
#
# These carry system requirements that a library consumer should not
# inherit: `cpal` links ALSA on Linux, so a plain `cargo add euhadra`
# used to fail to build unless libasound2-dev was installed — even for
# someone who only wanted the text-processing tiers. `clap` and
# `tracing-subscriber` are used solely by the binary.
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# default-features = false drops arboard's `image-data` support, which
# pulls in the `image` crate and its colour-management stack. The
# ClipboardEmitter only ever moves text.
arboard = { version = "3", default-features = false, optional = true }
cpal = { version = "0.15", optional = true }
# Voice activity detection. Pure Rust, `no_std`, and the 40 KiB network is
# embedded in the crate — no ONNX runtime, no model download, nothing to
# add to docs/model-licenses.md. That is why it is this one and not
# `voice_activity_detector` (Silero via ort) or the several
# two-digit-download Silero wrappers: everything else drags in an
# inference runtime to answer a yes/no question.
earshot = { version = "1.2", optional = true }

# ONNX inference (opt-in)
# rc.13 is stated rather than inherited. parakeet-rs-featsize requires
# it, and a caret range on a pre-release resolves upward, so declaring
# rc.12 here would have silently built against rc.13 anyway — with the
# manifest claiming otherwise.
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.21", optional = true }
# A published fork of parakeet-rs, not the upstream crate. Upstream
# hardcodes the mel filterbank to 128, which is right for the v2/v3
# models but wrong for Hybrid TDT-CTC models trained on 80 mels such as
# nvidia/parakeet-tdt_ctc-0.6b-ja — ONNX Runtime rejects those outright.
# The fork reads the size off the encoder graph, which declares it, so
# `from_pretrained` covers both. It keeps the library name
# `parakeet_rs`, so the `use parakeet_rs::…` in src/parakeet.rs is
# unaffected.
#
# This was a git dependency until crates.io refused to accept the crate
# — git deps are not publishable, `optional` included. Drop this and go
# back to upstream once the fix lands there.
parakeet-rs-featsize = { version = "0.3.8", optional = true }
# FFT for the Kaldi-style FBANK front-end used by Paraformer-large.
# Optional + onnx-gated so the default build stays lean.
rustfft = { version = "6", optional = true }

[features]
# Lean by default: the pipeline runtime plus the rule-based Tier 1/2
# text processing, with no ML runtime and no system libraries.
default = []

# Microphone capture via cpal. Requires ALSA headers on Linux
# (libasound2-dev); no extra system packages on macOS or Windows.
mic = ["dep:cpal"]

# ClipboardEmitter via arboard.
clipboard = ["dep:arboard"]

# `EarshotVad`, the neural voice activity detector. Adds one pure-Rust
# dependency and no system libraries; the `vad` module's trait, segmenter
# and `EnergyVad` fallback are in the default build regardless.
vad = ["dep:earshot"]

# Mock adapters and the evaluation harness. Off by default: they are how
# euhadra is tested and measured, not how it is used, and leaving them on
# the default surface would make 50-odd internal items SemVer promises.
# Enable this to build mocks into your own tests against euhadra's traits.
testing = []

# Everything the `euhadra` binary needs. Enable this for
# `cargo install euhadra`; a library consumer normally does not.
cli = ["dep:clap", "dep:tracing-subscriber", "mic", "clipboard"]

onnx = [
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:parakeet-rs-featsize",
    "dep:rustfft",
]

[[bin]]
name = "euhadra"
path = "src/main.rs"
required-features = ["cli"]

# Canary tensor dump tool — only buildable with the onnx feature
# because it pulls in `euhadra::canary::*` directly and instantiates
# an ort Session.
[[example]]
name = "dump_canary_rust_tensors"
required-features = ["onnx"]

# WhisperOnnxAdapter smoke bench on FLEURS-ko. Same 10-utt set the
# #83 measurement session ran against the Python POC, so we can
# directly compare the Rust port's CER + RTF against POC numbers.
[[example]]
name = "bench_whisper_onnx_ko"
required-features = ["onnx"]

# DolphinAdapter smoke bench. The port's acceptance test is that its
# transcripts match sherpa-onnx's on the same manifest, so this can
# dump the same two-column form scripts/run_sherpa_ctc.py writes.
[[example]]
name = "bench_dolphin_ko"
required-features = ["onnx"]

[dev-dependencies]
# euhadra depends on itself with `testing` on so that integration tests
# and the eval examples get the mocks and the harness without every
# `cargo test` needing an explicit --features flag. Unit tests inside the
# crate are covered by the `cfg(test)` half of the gate in lib.rs.
euhadra = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
# Used by examples/eval_l2.rs for FFT-based RIR convolution. Dev-only
# so default cargo build stays lean.
rustfft = "6"
# The eval runners parse their arguments with clap. It is an optional
# dependency of the library now (see the `cli` feature), so the examples
# need their own dev-only copy to keep building without `--features cli`.
clap = { version = "4", features = ["derive", "env"] }


# CI smoke check that an embedding backend is functional in all five
# pipeline languages. Instantiates `EmbeddingBackend` directly.
[[example]]
name = "check_embedder"
required-features = ["onnx"]

# Paragraph-segmentation evaluation (Pk / WindowDiff). Needs the onnx
# feature for the embedding segmenters; the baselines alone would not.
[[example]]
name = "eval_paragraph"
required-features = ["onnx"]
